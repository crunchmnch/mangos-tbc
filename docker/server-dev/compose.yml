# Dev server - admin access only
# Start:   docker compose up -d        (run from this directory)
# Stop:    docker compose down
# Logs:    docker compose logs -f
# Rebuild: docker compose up -d --build
#
# HeidiSQL: connect to 127.0.0.1:3307  user: root  pass: mangos
# Auth server on 127.0.0.1:3724
# World server on 127.0.0.1:8085

name: mangos-tbc-dev

services:
  database:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: mangos
      MARIADB_ROOT_HOST: "%"
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  realmd:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    command: /opt/mangos/bin/realmd -c /opt/mangos/etc/realmd.conf
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:3724:3724"
    volumes:
      - ./config:/opt/mangos/etc
      - ./logs:/opt/mangos/logs
    restart: unless-stopped

  mangosd:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    command: /opt/mangos/bin/mangosd -c /opt/mangos/etc/mangosd.conf -a /opt/mangos/etc/ahbot.conf
    stdin_open: true
    tty: true
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8085"
    volumes:
      - ./config:/opt/mangos/etc
      - ./logs:/opt/mangos/logs
      - map-data:/opt/mangos/data:ro
    restart: unless-stopped

volumes:
  db-data:
  map-data: